<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Lenox — builds things that feel fast">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F1012"/>
      <stop offset="1" stop-color="#15171C"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4C8DFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#4C8DFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#4C8DFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.18" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#4C8DFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#4C8DFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="24" fill="url(#grid)"/>
  <rect width="1200" height="300" rx="24" fill="url(#halo)"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="24" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <!-- sound-bar mark -->
  <g transform="translate(96 150)">
    <rect x="-30" y="-16" width="10" height="32" rx="5" fill="#4C8DFF">
      <animate attributeName="height" values="32;52;28;44;32" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-16;-26;-14;-22;-16" dur="2.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="-5" y="-38" width="10" height="76" rx="5" fill="#4C8DFF">
      <animate attributeName="height" values="76;48;84;56;76" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-38;-24;-42;-28;-38" dur="2.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="20" y="-26" width="10" height="52" rx="5" fill="#4C8DFF">
      <animate attributeName="height" values="52;30;60;36;52" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-26;-15;-30;-18;-26" dur="2.6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#E8E9EC">
    <text x="190" y="128" font-size="58" font-weight="700" letter-spacing="-1.5">Lenox</text>
    <text x="190" y="176" font-size="22" font-weight="400" fill="#A5A8B1">Builds Windows tools and FiveM scripts that feel instant.</text>
    <text x="190" y="226" font-size="15" font-weight="500" fill="#6E727C" letter-spacing="2">C#  ·  .NET  ·  WPF  ·  LUA  ·  JAVASCRIPT  ·  LOCAL AI</text>
  </g>

  <rect x="190" y="248" width="420" height="2" rx="1" fill="url(#glow)">
    <animate attributeName="x" values="150;220;150" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>
