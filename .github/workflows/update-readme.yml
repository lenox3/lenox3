name: Update profile README

on:
  schedule:
    - cron: "17 */6 * * *"   # every six hours
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/**, .github/workflows/update-readme.yml]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate README from public repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: python scripts/build_readme.py
      - name: Commit if changed
        run: |
          if git diff --quiet README.md; then echo "no changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Refresh profile README"
          git push
